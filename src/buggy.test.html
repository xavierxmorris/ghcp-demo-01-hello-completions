<!doctype html>
<html>
<head><meta charset="utf-8"><title>buggy.js tests</title></head>
<body>
<pre id="out">Running…</pre>
<script type="module">
  import { isLeapYear } from './buggy.js';
  const cases = [
    [2000, true], [1900, false], [2024, true], [2023, false],
    [1600, true], [1700, false], [2100, false], [2400, true],
  ];
  const lines = cases.map(([y, expected]) => {
    const got = isLeapYear(y);
    const ok = got === expected ? '✅' : '❌';
    return `${ok} isLeapYear(${y}) → ${got} (expected ${expected})`;
  });
  document.getElementById('out').textContent = lines.join('\n');
</script>
</body>
</html>
